{{- $level := .Level -}}
{{- $anchor := .Anchor -}}
{{- $text := .Text -}}
{{- $page := .Page -}}
{{- $aria := i18n "heading_anchor_aria" | default "Link to this heading" -}}
<h{{ $level }} id="{{ $anchor }}" class="heading-anchored">{{- $text | safeHTML -}}
{{- if and (not $page.IsHome) $anchor -}}
<a href="#{{ $anchor }}" class="heading-anchor" aria-label="{{ $aria }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></a>
{{- end -}}
</h{{ $level }}>
