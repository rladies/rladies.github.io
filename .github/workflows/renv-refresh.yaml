name: Refresh renv lockfiles

on:
  workflow_dispatch:
    inputs:
      snapshot_date:
        description: "PPM snapshot date (YYYY-MM-DD); defaults to yesterday"
        required: false
  # TEMPORARY: lets this branch generate its first Linux-built lockfiles.
  # Removed before merge; workflow_dispatch only works from the default branch.
  push:
    branches:
      - fix/renv-ci-binaries

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Re-snapshot profiles
    # Must match the image the R workflows run on: PPM serves binaries per
    # distro release, so a snapshot taken elsewhere pins versions that have no
    # binary here and CI goes back to compiling from source.
    runs-on: ubuntu-24.04
    env:
      RENV_CONFIG_SANDBOX_ENABLED: FALSE
      SNAPSHOT_DATE: ${{ inputs.snapshot_date }}
      GITHUB_PAT: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve the snapshot date
        run: |
          # Today's snapshot is still being written, so default to yesterday.
          echo "SNAPSHOT_DATE=${SNAPSHOT_DATE:-$(date -u -d yesterday +%F)}" >> "$GITHUB_ENV"

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'renv'

      - name: Install system requirements
        run: |
          for lockfile in renv/profiles/*/renv.lock; do
            python3 scripts/install_sysreqs.py "$lockfile"
          done

      - name: Re-snapshot each profile
        run: |
          for lockfile in renv/profiles/*/renv.lock; do
            profile=$(basename "$(dirname "$lockfile")")
            echo "::group::$profile"
            RENV_PROFILE="$profile" Rscript scripts/refresh_renv.R
            echo "::endgroup::"
          done

      - name: Pin the root lockfile
        run: |
          r_version=$(Rscript -e 'cat(paste(R.version$major, R.version$minor, sep = "."))')
          python3 scripts/pin_renv_snapshot.py \
            --r-version "$r_version" \
            --snapshot-date "$SNAPSHOT_DATE"

      - name: Check consistency
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/check_renv_consistency.py

      - name: Upload refreshed lockfiles
        uses: actions/upload-artifact@v4
        with:
          name: renv-lockfiles
          path: |
            renv.lock
            renv/settings.json
            renv/profiles/*/renv.lock
